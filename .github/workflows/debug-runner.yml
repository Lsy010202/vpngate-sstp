name: Debug Runner (temporary)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "要运行的诊断脚本"
        required: true
        default: "debug_full.py"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python ${{ inputs.script }}
        env:
          EDT_DOMAIN: ${{ secrets.EDT_DOMAIN }}
          EDT_UUID: ${{ secrets.EDT_UUID }}
