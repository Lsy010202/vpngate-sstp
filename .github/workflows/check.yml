name: VPN Gate Node Check

on:
  schedule:
    # 每小时一次(错开整点); 免费额度约 2000 分钟/月, 每小时跑一次约消耗 700-1000 分钟/月
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check VPN Gate nodes + build pages
        run: python vpngate.py
        env:
          EDT_DOMAIN: ${{ secrets.EDT_DOMAIN }}
          EDT_UUID: ${{ secrets.EDT_UUID }}
          DEBUG_SSTP: "1"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
